name: Mirror Portfolio

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-updated]

# One run at a time; a newer request queues instead of colliding
concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install --no-save --no-audit --no-fund puppeteer

      - name: Mirror pages (consent-gated AdSense)
        env:
          BASE_URL: https://creativepulse.42web.io/cps/
          ADSENSE_PUB: pub-9638774372490271
          PAGES: port_kirui.php,liv.php,valmanu.php
        run: node .github/scripts/mirror.js

      - name: Add visit beacon to mirrored pages
        env:
          TRACK_URL: https://creativepulse.42web.io/cps/track.php?i=1
        run: |
          node - <<'JS'
          const fs = require('fs'), path = require('path');
          const url = process.env.TRACK_URL;
          const tag = '<script data-visit-beacon>(function(){try{var k="cp_v_"+new Date().toISOString().slice(0,10);'
            + 'if(sessionStorage.getItem(k))return;sessionStorage.setItem(k,"1");var u="' + url + '";'
            + 'var b=new Blob(["p="+encodeURIComponent(location.pathname)],{type:"application/x-www-form-urlencoded"});'
            + 'if(navigator.sendBeacon){navigator.sendBeacon(u,b);}else{fetch(u,{method:"POST",mode:"no-cors",body:b,keepalive:true});}}catch(e){}})();</script>';
          let n = 0;
          (function walk(d) {
            for (const f of fs.readdirSync(d, { withFileTypes: true })) {
              if (['node_modules', '.git', '.github'].includes(f.name)) continue;
              const p = path.join(d, f.name);
              if (f.isDirectory()) walk(p);
              else if (/\.html?$/i.test(f.name)) {
                let h = fs.readFileSync(p, 'utf8');
                if (h.includes('data-visit-beacon')) continue;          // already added: safe to re-run
                h = /<\/body>/i.test(h) ? h.replace(/<\/body>/i, tag + '</body>') : h + tag;
                fs.writeFileSync(p, h); n++;
              }
            }
          })('.');
          console.log('Beacon added to ' + n + ' page(s).');
          JS

      - name: Commit and push (only if content changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude)node_modules' ':(exclude)package.json' ':(exclude)package-lock.json'
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Mirror update $(TZ=Africa/Nairobi date '+%Y-%m-%d %H:%M') EAT"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
