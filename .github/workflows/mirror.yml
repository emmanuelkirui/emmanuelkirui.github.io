name: Mirror Portfolio

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [portfolio-updated]

# One run at a time; a newer request queues instead of colliding
concurrency:
  group: mirror
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  mirror-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install --no-save --no-audit --no-fund puppeteer

      - name: Mirror pages (consent-gated AdSense)
        env:
          BASE_URL: https://creativepulse.42web.io/cps/
          ADSENSE_PUB: pub-9638774372490271
          PAGES: port_kirui.php,liv.php,valmanu.php
        run: node .github/scripts/mirror.js

      - name: Commit and push (only if content changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' ads.txt
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "Mirror update $(date -u '+%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
