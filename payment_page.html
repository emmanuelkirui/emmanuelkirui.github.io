<html lang="en"><head><script>
(function(){
  var KEY='ek_cookie_consent', loaded=false;
  function accepted(){
    try{var d=JSON.parse(localStorage.getItem(KEY));
      return !!d && d.choice==='accepted' && new Date()<=new Date(d.expires);}catch(e){return false;}
  }
  function loadAds(){
    if(loaded||window.__adsLoaded) return; loaded=window.__adsLoaded=true;
    var s=document.createElement('script'); s.async=true; s.crossOrigin='anonymous';
    s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9638774372490271';
    document.head.appendChild(s);
  }
  if(accepted()) loadAds();
  window.addEventListener('ek:consent',function(e){ if(e.detail&&e.detail.choice==='accepted') loadAds(); });
  document.addEventListener('click',function(e){
    if(e.target.closest('#cookieAccept,.cookie-accept')) setTimeout(function(){ if(accepted()) loadAds(); },50);
  });
})();</script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="screen">

    <style>
        :root {
            --primary-color: #007bff;
            --accent-color: #ff8c00;
            --error-color: #dc3545;
            --modal-bg-light: #ffffff;
            --text-color-light: #333;
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.2);
            --border-radius: clamp(8px, 2vw, 10px);
            --padding-sm: clamp(0.5rem, 2vw, 0.8rem);
            --padding-md: clamp(0.8rem, 2.5vw, 1.2rem);
            --font-size-sm: clamp(0.75rem, 2vw, 0.9rem);
            --font-size-md: clamp(0.85rem, 2.5vw, 1rem);
            --font-size-lg: clamp(1.2rem, 3vw, 1.5rem);
            --touch-target: 48px;
            --button-gap: clamp(1rem, 3vh, 2rem);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Arial', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--primary-color), #002a5c);
            display: flex; justify-content: center; align-items: center;
            color: var(--text-color-light); padding: var(--padding-sm);
        }

        .mode-badge {
            position: fixed; top: 12px; right: 12px;
            padding: .25rem .65rem; border-radius: 50px;
            font-size: .75rem; font-weight: 700;
            display: flex; align-items: center; gap: .35rem;
            z-index: 9999; letter-spacing: .03em;
        }
        .mode-badge.sandbox { background: #fff3e0; color: #ff8c00; }
        .mode-badge.live    { background: #e8f5e9; color: #28a745; }

        .button-container {
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; padding: var(--padding-md); width: 100%;
            max-width: 1600px; margin: 0 auto; gap: var(--button-gap);
        }

        #openModal, .go-back {
            padding: var(--padding-md); font-size: var(--font-size-md);
            font-weight: 600; border: none; border-radius: var(--border-radius);
            cursor: pointer; transition: all 0.3s ease;
            min-height: var(--touch-target); width: min(90%, 300px);
            display: flex; align-items: center; justify-content: center;
        }
        #openModal {
            background: linear-gradient(135deg, var(--accent-color), #e67e00);
            color: #fff; box-shadow: var(--shadow-sm);
        }
        #openModal:hover { transform: translateY(-2px); background: linear-gradient(135deg, #e67e00, var(--accent-color)); }
        .go-back { background: linear-gradient(135deg, var(--primary-color), #0056b3); color: #fff; }
        .go-back:hover { transform: translateY(-2px); background: linear-gradient(135deg, #0056b3, var(--primary-color)); }
        #openModal i, .go-back i { margin-right: 0.5rem; }

        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,.75); z-index: 1000;
            padding: var(--padding-sm); backdrop-filter: blur(8px); overflow-y: auto;
        }
        .modal-content {
            max-width: min(95vw, 600px); max-height: 90vh;
            margin: clamp(5vh, 10vh, 15vh) auto;
            background: var(--modal-bg-light); padding: var(--padding-md);
            border-radius: var(--border-radius); text-align: center;
            color: var(--text-color-light); box-shadow: var(--shadow-sm);
            border: 1px solid rgba(0,123,255,.2); overflow-y: auto;
        }
        .modal-content h2 {
            font-size: var(--font-size-lg); font-weight: 700; color: var(--primary-color);
            margin-bottom: var(--padding-sm); display: flex;
            align-items: center; justify-content: center; gap: .5rem;
        }
        .modal-content h2 i { font-size: calc(var(--font-size-lg)*.9); animation: pulse 2s infinite ease-in-out; }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
        .modal-content p { font-size: var(--font-size-md); color: #555; margin-bottom: var(--padding-sm); }
        .close {
            position: absolute; top: var(--padding-sm); right: var(--padding-sm);
            color: var(--text-color-light); font-size: var(--font-size-lg); cursor: pointer;
        }
        .close:hover { color: var(--primary-color); }

        #amount, #guestEmail {
            width: 100%; max-width: min(90vw, 320px); padding: var(--padding-sm);

<body>

    <!-- Mode indicator badge -->
    <div class="mode-badge live">
                    <i class="fas fa-circle" style="font-size:.5rem;color:#28a745"></i> LIVE
            </div>

    <div class="button-container">
        <button id="openModal" aria-label="Open PayPal Checkout"><i class="fas fa-credit-card"></i> Checkout with PayPal</button>
        <button class="go-back" id="goBackButton" aria-label="Go Back"><i class="fas fa-arrow-left"></i> Go Back</button>
    </div>

    <div id="paypalModal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <span class="close" id="closeModal" aria-label="Close Modal">×</span>
            <h2><i class="fas fa-lock"></i> Secure Checkout</h2>
            <p>Enter the amount you wish to pay in USD</p>
            <form id="paymentForm">
                <input type="number" id="amount" name="amount" placeholder="e.g., 20.00" min="0.01" step="0.01" value="20.00" aria-label="Payment Amount in USD" aria-describedby="feedback" required="" oninvalid="this.setCustomValidity('Please enter a valid amount (minimum 0.01 USD)')" oninput="this.setCustomValidity('')">
                                    <input type="email" id="guestEmail" name="guestEmail" placeholder="Enter your email (optional)" aria-label="Guest Email (Optional)" aria-describedby="feedback">
                                <div class="paypal-feedback" id="feedback" role="alert"></div>
                <div id="paypal-buttons"></div>
                <button type="button" class="go-back" id="goBackButtonModal" aria-label="Go Back">
                    <i class="fas fa-arrow-left"></i> Go Back
                </button>
            </form>
        </div>
    </div>

    <script>
        function logError(message) {
            console.error(`[PayPal Checkout ${new Date().toISOString()}] ${message}`);
            fetch('https://creativepulse.42web.io/cps/log.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `[Client] ${message}` })
            }).catch(() => {});
        }

        const modal           = document.getElementById("paypalModal");
        const openModal       = document.getElementById("openModal");
        const closeModal      = document.getElementById("closeModal");
        const goBackButtons   = document.querySelectorAll("#goBackButton, #goBackButtonModal");
        const paymentForm     = document.getElementById("paymentForm");
        const amountInput     = document.getElementById("amount");
        const guestEmailInput = document.getElementById("guestEmail");
        const feedback        = document.getElementById("feedback");
        let paypalButtonsRendered = false;

        // ── Check SDK loaded on page load ─────────────────────────────────────
        // Since the SDK is now a static <script> in <head>, window.paypal will be
        // defined by the time this runs. If not, the SDK itself failed to load
        // (network issue or PayPal server problem) — show a clear message.
        function isSdkReady() {
            if (typeof window.paypal === 'undefined' || typeof window.paypal.Buttons !== 'function') {
                feedback.textContent = 'PayPal failed to load. Please refresh the page.';
                logError('window.paypal is not defined — SDK did not load');
                return false;
            }
            return true;
        }

        // ── Validation helpers ────────────────────────────────────────────────
        function validateAmount(value) {
            const amount = parseFloat(value);
            if (!value || isNaN(amount) || amount < 0.01) {
                feedback.textContent = "Please enter a valid amount (minimum 0.01 USD).";
                amountInput.setCustomValidity("Invalid amount");
                return false;
            }
            feedback.textContent = "";
            amountInput.setCustomValidity("");
            return true;
        }

        function validateEmail(email) {
            if (!email) return true;
            const isValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
            if (!isValid) {
                feedback.textContent = "Please enter a valid email address or leave it blank.";
                guestEmailInput.setCustomValidity("Invalid email");
            } else {
                feedback.textContent = "";
                guestEmailInput.setCustomValidity("");
            }
            return isValid;
        }

        function updatePaypalButtons() {
            const amountValid = validateAmount(amountInput.value);
            const emailValid  = guestEmailInput ? validateEmail(guestEmailInput.value.trim()) : true;
            if (amountValid && emailValid && !paypalButtonsRendered) {
                renderPaypalButtons();
            } else if (paypalButtonsRendered && (!amountValid || !emailValid)) {
                document.getElementById("paypal-buttons").innerHTML = "";
                paypalButtonsRendered = false;
            }
        }

        // ── Modal controls ────────────────────────────────────────────────────
        openModal.addEventListener("click", () => {
            modal.style.display = "block";
            amountInput.focus();
            logError('Modal opened');
            updatePaypalButtons();
        });
        closeModal.addEventListener("click", () => {
            modal.style.display = "none";
            feedback.textContent = '';
        });
        goBackButtons.forEach(btn => btn.addEventListener("click", () => window.history.back()));
        window.onclick = e => { if (e.target === modal) { modal.style.display = "none"; feedback.textContent = ''; } };
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && modal.style.display === 'block') {
                modal.style.display = "none";
                feedback.textContent = '';
            }
        });
        amountInput.addEventListener('input', updatePaypalButtons);
        if (guestEmailInput) guestEmailInput.addEventListener('input', updatePaypalButtons);
        paymentForm.addEventListener('submit', e => { e.preventDefault(); updatePaypalButtons(); });

        // ── Render PayPal buttons ─────────────────────────────────────────────
        // SDK is already loaded statically — no dynamic script injection needed.
        function renderPaypalButtons() {
            if (!isSdkReady()) return;
            if (paypalButtonsRendered) return;

            paypal.Buttons({
                createOrder: (data, actions) => {
                    const amount     = parseFloat(amountInput.value);
                    const fmtAmount  = amount.toFixed(2);
                    const guestEmail = guestEmailInput ? guestEmailInput.value.trim() : '';

                    if (!validateAmount(amountInput.value)) {
                        Swal.fire({ icon:'error', title:'Invalid Amount',
                            text:'Please enter a valid amount in USD (minimum 0.01).',
                            confirmButtonColor:'#007bff' });
                        return Promise.reject('Invalid amount');
                    }
                    if (guestEmail && !validateEmail(guestEmail)) {
                        Swal.fire({ icon:'error', title:'Invalid Email',
                            text:'Please enter a valid email address or leave it blank.',
                            confirmButtonColor:'#007bff' });
                        return Promise.reject('Invalid email');
                    }

                    logError('Creating PayPal order for amount: ' + fmtAmount);
                    return actions.order.create({
                        purchase_units: [{ amount: { currency_code:'USD', value: fmtAmount } }],
                        application_context: { brand_name:'CPS', landing_page:'BILLING', user_action:'PAY_NOW' }
                    });
                },
                onApprove: async (data, actions) => {
                    try {
                        logError('Capturing order: ' + data.orderID);
                        const controller = new AbortController();
                        const timeoutId  = setTimeout(() => controller.abort(), 10000);
                        const response   = await fetch('https://creativepulse.42web.io/cps/payment_success.php', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                orderID:    data.orderID,
                                guestEmail: guestEmailInput ? guestEmailInput.value.trim() : '',
                                userId:     ''
                            }),
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        logError(`Fetch response status: ${response.status}`);

                        if (!response.ok) {
                            const txt = await response.text();
                            throw new Error(`Server returned ${response.status}: ${txt || 'Unknown error'}`);
                        }
                        const contentType = response.headers.get('content-type');
                        if (!contentType || !contentType.includes('application/json')) {
                            throw new Error('Server did not return valid JSON');
                        }

                        const result = await response.json();
                        if (result.success) {
                            logError('Payment captured: ' + data.orderID);
                            Swal.fire({
                                icon:'success', title:'Payment Successful',
                                html:`Amount: <b>${result.amount} USD</b><br>Transaction ID: <b>${result.transaction_id || data.orderID}</b><br><small>Keep this ID for your records.</small>`,
                                confirmButtonColor:'#007bff'
                            }).then(() => {
                                modal.style.display = 'none';
                                feedback.textContent = '';
                            });
                        } else {
                            logError('Capture failed: ' + JSON.stringify(result));
                            Swal.fire({ icon:'error', title:'Payment Error',
                                text: result.message || 'Failed to capture payment. Contact support.',
                                confirmButtonColor:'#007bff' });
                            modal.style.display = 'none'; feedback.textContent = '';
                        }
                    } catch (error) {
                        logError('Capture error: ' + error.message);
                        Swal.fire({ icon:'error', title:'Submission Error',
                            text:`Failed to process payment: ${error.message}. Order ID: ${data.orderID}`,
                            confirmButtonColor:'#007bff' });
                        modal.style.display = 'none'; feedback.textContent = '';
                    }
                },
                onCancel: () => {
                    Swal.fire({ icon:'info', title:'Payment Cancelled',
                        text:'Your payment was cancelled. Try again anytime.',
                        confirmButtonColor:'#007bff' });
                },
                onError: err => {
                    logError('PayPal SDK error: ' + (err.message || JSON.stringify(err)));
                    Swal.fire({ icon:'error', title:'PayPal Error',
                        text:'An error occurred with PayPal. Please try again.',
                        confirmButtonColor:'#007bff' });
                }
            }).render('#paypal-buttons');
            paypalButtonsRendered = true;
        }
    </script>
