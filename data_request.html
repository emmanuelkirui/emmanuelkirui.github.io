            <script>

            function toggleTheme() {

            <script>
            // reCAPTCHA v2 is 304px wide; shrink it on narrow screens
            function fitCaptcha() {
                var wrap = document.getElementById('captchaWrap');
                var box = wrap && wrap.querySelector('.g-recaptcha');
                if (!wrap || !box) return;
                var avail = wrap.parentElement.clientWidth;
                var scale = Math.min(1, avail / 304);
                box.style.transform = 'scale(' + scale + ')';
                wrap.style.width = (304 * scale) + 'px';
                wrap.style.height = (78 * scale) + 'px';
                wrap.style.margin = '14px auto';
            }
            window.addEventListener('load', fitCaptcha);
            window.addEventListener('resize', fitCaptcha);

            async function requestData(event) {
                event.preventDefault();
                
                const form = document.getElementById('dataRequestForm');
                const submitBtn = document.getElementById('submitBtn');
                const messageDiv = document.getElementById('message');
                const password = document.getElementById('password').value;
                const email = document.getElementById('email').value;

                messageDiv.style.display = 'none';

                const captchaToken = (window.grecaptcha && grecaptcha.getResponse) ? grecaptcha.getResponse() : '';
                if (!captchaToken) {
                    messageDiv.style.display = 'block';
                    messageDiv.textContent = 'Please tick the "I\'m not a robot" box first.';
                    messageDiv.className = 'message error';
                    return;
                }
                
                submitBtn.disabled = true;
                submitBtn.textContent = 'Processing...';

                try {
                    const response = await fetch('/cps/data_request.php', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Requested-With': 'XMLHttpRequest'
                        },
                        body: JSON.stringify({ 
                            password: password,
                            email: email,
                            captcha_token: captchaToken
                        })
                    });

                    const data = await response.json();
                    
                    messageDiv.style.display = 'block';
                    messageDiv.textContent = data.message;
                    messageDiv.className = `message ${data.success ? 'success' : 'error'}`;
                    
                    if (data.success) {
                        form.reset();
                    }
                } catch (error) {
                    messageDiv.style.display = 'block';
                    messageDiv.textContent = 'A network error occurred. Please try again.';
                    messageDiv.className = 'message error';
                    console.error('Request failed:', error);
                } finally {
                    if (window.grecaptcha) grecaptcha.reset(); // a token can only be used once
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Request My Data';
                }
            }
            </script>
